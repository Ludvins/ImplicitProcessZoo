name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[experiments,tracking,test]"
      - run: python -m pip check
      - name: Run documentation examples
        shell: bash
        run: |
          for example in docs/examples/*.py; do
            python "$example"
          done
      - run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[experiments,tracking,test]"
      - run: python -m pip check
      - run: ruff format --check .
      - run: ruff check .
      - name: Check CLI help
        shell: bash
        run: |
          python -m experiments.uci.benchmark --help
          python -m experiments.regression.benchmark --help
          python -m experiments.classification.benchmark --help
          python -m experiments.synthetic.plot --help
          python -m experiments.synthetic.prior_fidelity --help
          python -m experiments.volterra.benchmark --help
          python -m experiments.volterra.plot --help
          python -m experiments.simulator_forecasting.benchmark --help
          python -m experiments.simulator_forecasting.plot --help
          python -m experiments.eld_forecasting.benchmark --help
          python -m experiments.eld_forecasting.plot --help
      - name: ELD synthetic smoke
        run: >-
          python -m experiments.eld_forecasting.benchmark
          --methods analog,vip,gmvip_empirical
          --smoke
          --target-ids 0
          --seed 0
          --output-root results/ci_eld
          --disable-tqdm
      - run: python -m build
      - run: python -m twine check dist/*
