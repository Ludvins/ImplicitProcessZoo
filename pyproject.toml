[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "implicit-process-zoo"
version = "0.1.0"
description = "Research implementations of function-space variational inference for implicit processes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luis A. Ortega" }]
keywords = ["bayesian-inference", "implicit-processes", "variational-inference", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.6",
  "tqdm>=4.66",
]

[project.optional-dependencies]
experiments = [
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "Pillow>=10",
  "PyYAML>=6",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "xlrd>=2",
]
vision = ["torchvision>=0.21"]
tracking = ["wandb>=0.19"]
docs = [
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.29",
  "numpydoc>=1.10",
]
test = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.11",
  "twine>=6",
]

[project.urls]
Documentation = "https://ludvins.github.io/ImplicitProcessZoo/"
Repository = "https://github.com/Ludvins/ImplicitProcessZoo"
Issues = "https://github.com/Ludvins/ImplicitProcessZoo/issues"

[tool.setuptools.packages.find]
include = ["implicit_process_zoo*", "experiments*"]

[tool.setuptools.package-data]
"experiments.eld_forecasting" = ["paper_targets.csv", "regeneration.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["implicit_process_zoo", "experiments"]

[tool.coverage.report]
fail_under = 54
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["data", "local_scripts", "outputs", "results", "slides", "tmp", "wandb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.ruff.format]
exclude = ["*.md"]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
